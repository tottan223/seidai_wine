<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鮨せい大 Wine List</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    color: #111;
    font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
    min-height: 100vh;
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    padding: 36px 24px 28px;
    text-align: center;
    border-bottom: 1px solid #111;
  }
  .restaurant-name {
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: #555;
  }
  .list-title {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: 0.12em;
  }

  .lang-bar {
    display: flex;
    border-bottom: 1px solid #ddd;
  }
  .lang-btn {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    padding: 10px 4px;
    cursor: pointer;
    text-transform: uppercase;
    color: #aaa;
    transition: color 0.15s;
    margin-bottom: -1px;
  }
  .lang-btn.active {
    color: #111;
    border-bottom-color: #111;
  }

  .tabs {
    display: flex;
    border-bottom: 1px solid #ddd;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    padding: 12px 4px;
    cursor: pointer;
    text-transform: uppercase;
    color: #aaa;
    transition: color 0.15s;
    margin-bottom: -1px;
  }
  .tab-btn.active {
    color: #111;
    border-bottom-color: #111;
  }

  .category-header {
    padding: 24px 20px 8px;
    font-size: 10px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: #aaa;
  }

  .wine-item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 16px;
    padding: 14px 20px;
    border-bottom: 1px solid #eee;
    align-items: start;
  }
  .wine-item.out-of-stock { opacity: 0.35; }

  .wine-name {
    font-size: 15px;
    font-weight: 400;
    line-height: 1.4;
    letter-spacing: 0.01em;
  }
  .wine-vintage {
    display: inline;
    font-size: 13px;
    color: #888;
    margin-left: 6px;
  }
  .wine-sub {
    font-size: 11.5px;
    color: #888;
    margin-top: 3px;
    letter-spacing: 0.04em;
    font-style: italic;
  }

  .wine-price {
    font-size: 16px;
    font-weight: 300;
    white-space: nowrap;
    text-align: right;
  }
  .price-sub {
    font-size: 10px;
    color: #aaa;
    display: block;
    margin-top: 2px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: right;
  }

  footer {
    text-align: center;
    padding: 28px 20px;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: #aaa;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<header>
  <div class="restaurant-name">Sushi Seidai · Ebisu</div>
  <div class="list-title">Wine List</div>
</header>

<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('ja')">日本語</button>
  <button class="lang-btn" onclick="setLang('en')">English</button>
  <button class="lang-btn" onclick="setLang('zh')">中文</button>
  <button class="lang-btn" onclick="setLang('ko')">한국어</button>
</div>

<div class="tabs">
  <button class="tab-btn active" data-cat="all" onclick="setCategory('all')"><span class="tab-label">All</span></button>
  <button class="tab-btn" data-cat="red" onclick="setCategory('red')"><span class="tab-label">Red</span></button>
  <button class="tab-btn" data-cat="white" onclick="setCategory('white')"><span class="tab-label">White</span></button>
  <button class="tab-btn" data-cat="sparkling" onclick="setCategory('sparkling')"><span class="tab-label">Sparkling</span></button>
</div>

<div id="wineList"></div>
<footer id="footer">Bottle · Tax included</footer>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbydq5_3lY-ZRB0rvpVK0RjpqfusbXPg3offvpN8cg3Y8MrMAn7PXLa9_J5EbSDF6mTQCA/exec';

const WINES = [
  // WHITE
  {category:"white",name:'Domaine des Amouriers "Suzanne"',region:"Vacqueyras, Rhône",country:"France",grape:"Grenache Blanc / Clairette",vintage:"",price:9600,in_stock:true},
  {category:"white",name:"Domaine Françoise Jeanniard Bourgogne Chardonnay",region:"Bourgogne",country:"France",grape:"Chardonnay",vintage:"2023",price:12400,in_stock:true},
  {category:"white",name:"Domaine Chevigny-Rousseau Bourgogne Blanc",region:"Bourgogne",country:"France",grape:"Chardonnay",vintage:"2023",price:13800,in_stock:true},
  {category:"white",name:"Domaine Françoise Jeanniard Pernand-Vergelesses",region:"Pernand-Vergelesses, Bourgogne",country:"France",grape:"Chardonnay",vintage:"2023",price:15500,in_stock:true},
  {category:"white",name:"Domaine du Pélican Arbois Chardonnay",region:"Arbois, Jura",country:"France",grape:"Chardonnay",vintage:"2022",price:18200,in_stock:true},
  {category:"white",name:"Domaine Pierre Guillemot Savigny-Lès-Beaune Dessus les Gollardes",region:"Savigny-lès-Beaune, Bourgogne",country:"France",grape:"Chardonnay",vintage:"2023",price:19000,in_stock:true},
  {category:"white",name:"Emmanuel Rouget Bourgogne Hautes-Côtes de Beaune",region:"Hautes-Côtes de Beaune, Bourgogne",country:"France",grape:"Chardonnay",vintage:"2023",price:28000,in_stock:true},
  {category:"white",name:"Emmanuel Rouget Bourgogne Hautes-Côtes de Nuits",region:"Hautes-Côtes de Nuits, Bourgogne",country:"France",grape:"Chardonnay",vintage:"2020",price:29000,in_stock:true},
  {category:"white",name:"Domaine Leflaive Clavoillion 375ml",region:"Puligny-Montrachet 1er Cru, Bourgogne",country:"France",grape:"Chardonnay",vintage:"2002",price:58000,in_stock:true},
  {category:"white",name:"Pierre & Louis Trapet Meursault les Vireuils",region:"Meursault, Bourgogne",country:"France",grape:"Chardonnay",vintage:"2020",price:74000,in_stock:true},
  {category:"white",name:"Domaine Leflaive Bâtard-Montrachet Grand Cru",region:"Bâtard-Montrachet Grand Cru, Bourgogne",country:"France",grape:"Chardonnay",vintage:"2013",price:340000,in_stock:true},
  // RED
  {category:"red",name:"Domaine Sylvie Esmonin Bourgogne Rouge Cuvée Sylvie",region:"Bourgogne",country:"France",grape:"Pinot Noir",vintage:"2022",price:13000,in_stock:true},
  {category:"red",name:"Domaine Jean-Marie Bouzereau Bourgogne Côte-d'Or Pinot Noir",region:"Côte-d'Or, Bourgogne",country:"France",grape:"Pinot Noir",vintage:"",price:18000,in_stock:true},
  {category:"red",name:"Emmanuel Rouget Bourgogne Passetoutgrain",region:"Bourgogne",country:"France",grape:"Pinot Noir / Gamay",vintage:"2023",price:19800,in_stock:true},
  {category:"red",name:"Nicolas-Jay Willamette Valley Pinot Noir",region:"Willamette Valley",country:"USA",grape:"Pinot Noir",vintage:"2017",price:21000,in_stock:true},
];

// 国名翻訳マップ（スプレッドシートのcountry列は英語で入力）
const COUNTRY_MAP = {
  ja:{ France:"フランス", Italy:"イタリア", Spain:"スペイン", Germany:"ドイツ", USA:"アメリカ", Australia:"オーストラリア", Japan:"日本", Austria:"オーストリア", Portugal:"ポルトガル", Chile:"チリ", Argentina:"アルゼンチン", "New Zealand":"ニュージーランド", "South Africa":"南アフリカ" },
  en:null, // そのまま表示
  zh:{ France:"法国", Italy:"意大利", Spain:"西班牙", Germany:"德国", USA:"美国", Australia:"澳大利亚", Japan:"日本", Austria:"奥地利", Portugal:"葡萄牙", Chile:"智利", Argentina:"阿根廷", "New Zealand":"新西兰", "South Africa":"南非" },
  ko:{ France:"프랑스", Italy:"이탈리아", Spain:"스페인", Germany:"독일", USA:"미국", Australia:"호주", Japan:"일본", Austria:"오스트리아", Portugal:"포르투갈", Chile:"칠레", Argentina:"아르헨티나", "New Zealand":"뉴질랜드", "South Africa":"남아프리카" },
};

const LABELS = {
  ja:{ soldOut:'品切れ', tax:'税込', footer:'ボトル・税込', cats:{red:'Red',white:'White',sparkling:'Sparkling'} },
  en:{ soldOut:'Sold Out', tax:'Tax incl.', footer:'Bottle · Tax included', cats:{red:'Red',white:'White',sparkling:'Sparkling'} },
  zh:{ soldOut:'售罄', tax:'含税', footer:'瓶装 · 含税', cats:{red:'Red',white:'White',sparkling:'Sparkling'} },
  ko:{ soldOut:'품절', tax:'세금포함', footer:'보틀 · 세금포함', cats:{red:'Red',white:'White',sparkling:'Sparkling'} },
};

let lang = 'ja', cat = 'all', wines = WINES;

function translateCountry(countryEn) {
  const map = COUNTRY_MAP[lang];
  if (!map) return countryEn;
  return map[countryEn] || countryEn;
}

async function loadData() {
  if (!GAS_URL) { render(); return; }
  try { const r = await fetch(GAS_URL); wines = await r.json(); } catch(e) {}
  render();
}

function render() {
  const L = LABELS[lang];
  document.getElementById('footer').textContent = L.footer;

  const cats = cat === 'all' ? ['sparkling','white','red'] : [cat];
  let html = '';
  for (const c of cats) {
    const list = wines
      .filter(w => w.category === c)
      .sort((a, b) => { if (a.in_stock !== b.in_stock) return a.in_stock ? -1 : 1; return a.price - b.price; });
    if (!list.length) continue;

    html += `<div class="category-header">${L.cats[c]}</div>`;
    for (const w of list) {
      const country = translateCountry(w.country);
      const sub = [country, w.region, w.grape].filter(Boolean).join(' · ');
      const vint = w.vintage ? `<span class="wine-vintage">${w.vintage}</span>` : '';
      const priceSub = w.in_stock ? L.tax : `<span style="color:#bbb">${L.soldOut}</span>`;
      html += `<div class="wine-item${w.in_stock ? '' : ' out-of-stock'}">
        <div>
          <div class="wine-name">${w.name}${vint}</div>
          <div class="wine-sub">${sub}</div>
        </div>
        <div>
          <div class="wine-price">¥${w.price.toLocaleString()}</div>
          <span class="price-sub">${priceSub}</span>
        </div>
      </div>`;
    }
  }

  document.getElementById('wineList').innerHTML = html;
}

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.l === l));
  render();
}

function setCategory(c) {
  cat = c;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === c));
  render();
}

// lang-btnにdata-l属性をセット
document.querySelectorAll('.lang-btn').forEach((b, i) => {
  b.dataset.l = ['ja','en','zh','ko'][i];
});

loadData();
</script>
</body>
</html>
